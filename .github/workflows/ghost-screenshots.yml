          const finish = async () => {
            for (const k of ["console", "page", "requests", "menu"]) report[k] = [...new Set(report[k])].slice(0, 12);
            await writeFile(path.join(OUT, "report.json"), JSON.stringify(report, null, 2));
            const fails = [];
            if (report.error) fails.push(report.error);
            if (report.login) {
              console.log("LOGIN: " + report.login.result + (report.login.steps.length ? " (" + report.login.steps.join(", ") + ")" : ""));
              if (report.login.result !== "ok" && !/^could not run|^login only/.test(report.login.result)) fails.push("the login doesn't work for a new person: " + report.login.result + ". The check signs up with an email and password, reloads, logs out, tries a wrong password and logs in again" + (report.login.steps.length ? " (it got as far as: " + report.login.steps.join(", ") + ")" : "") + ".");
            }
            for (const p of report.page) fails.push("uncaught error or page that won't open: " + p);
            for (const b of report.blank) fails.push(b + ": the page is blank (almost no text)");
            for (const c of report.console) console.log("WARN: console error: " + c);
            for (const r of report.requests) console.log("WARN: failed request: " + r);
            for (const m of report.menu) console.log("WARN: " + m);
            // The click test: a button that does nothing is a bug the user would hit at once.
            // Every button counts: one dead button is enough to fail (a task must not end at 7 of 8 and call itself done).
            // A button whose effect can't be seen on the page (copy, download, share, print) is reported, not failed.
            const dead = report.clicks.filter((c) => c.result === "does nothing").map((c) => "'" + c.label + "'");
            if (dead.length) fails.push((dead.length === 1 ? "this button does nothing when pressed: " : "these buttons do nothing when pressed: ") + dead.join(", ") + ". Make each one work (open, switch, add, filter...) or remove it");
            for (const c of report.clicks.filter((c) => c.result === "can't tell")) console.log("WARN: the button '" + c.label + "' changed nothing on the page (it may copy, download, share or print): make sure it does what its label says");
            // The refresh test: something the user added must still be there in a new browser.
            if (report.refresh?.result === "lost") fails.push("something added in the app ('" + report.refresh.word + "', typed into the first text box) is gone after reopening the app in a new browser" + (report.refresh.server ? " with the server restarted (data kept only in the server's memory is lost: save it in the database)" : "") + ": save what people add (localStorage, IndexedDB or the app's database) and load it on start");
            if (report.refresh) console.log("REFRESH (this device remembers): " + report.refresh.result);
