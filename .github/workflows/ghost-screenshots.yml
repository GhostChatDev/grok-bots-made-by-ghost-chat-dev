              }
            }
          }

          let root = null;
          let server = null;
          if (!url) {
          for (const d of [process.env.APP_DIR, "dist", "build", "out", ".", "docs", "public"]) {
            if (!d) continue;
            const dir = path.resolve(BASE, d);
            if (await has(path.join(dir, "index.html"))) { root = dir; break; }
          }
          if (!root) {
