              await finish();
            } else {
              report.served = "npm start (" + url + ")";
              console.log("SERVER: npm start answered at " + url + " after " + (s.ms / 1000).toFixed(1) + "s");
              report.commit = (process.env.GITHUB_SHA || "").slice(0, 7) || null;
              console.log("PHOTOGRAPHED: " + (report.commit ? "commit " + report.commit + ", " : "") + "served by this commit's own npm start");
            }
          }

          // A server in the code (server.js, app.js... calling listen) that nothing starts: the app can't run as it
          // would online, so testing its page files alone would pass a broken app. Fail and say what's missing.
          if (!url && !report.server && !process.env.GHOST_STATIC && !(pkg && pkg.scripts && pkg.scripts.start)) {
            for (const f of ["server.js", "server.mjs", "server.ts", "app.js", "index.js", "src/server.js", "src/server.ts", "src/index.js", "src/app.js"]) {
              const code = await readFile(path.join(BASE, f), "utf8").catch(() => "");
              if (code.includes(".listen(") && (code.includes("express") || code.includes("http") || code.includes("fastify") || code.includes("koa"))) {
                report.error = f + " is a server, but " + (pkg ? "package.json has no 'start' script" : "there is no package.json") + ", so the app can't run. Add a package.json with its dependencies and a 'start' script (e.g. 'node " + f + "') that listens on process.env.PORT.";
