          // An app with its own server (package.json has a "start" script): start it the way it runs online, with
          // PORT set (and DATABASE_URL when the workflow started a database), wait until it really answers, and test
          // that instead of the files. If it never answers, fail with the server's own output, so a slow or crashed
          // start isn't mistaken for a broken page.
          let url = null;
